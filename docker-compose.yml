version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POLLINATIONS_API_KEY=${POLLINATIONS_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./opspilot_trajectories.sqlite:/app/opspilot_trajectories.sqlite

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
